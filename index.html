<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Onboarding Cortez IA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 40px 0;
        display: flex;
        justify-content: center;
    }

    .container {
        background: #ffffff;
        width: 100%;
        max-width: 520px;
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 0 25px rgba(0,0,0,0.09);
    }

    h1 {
        text-align: center;
        font-size: 26px;
        margin-bottom: 20px;
    }

    label {
        font-weight: bold;
        margin-top: 15px;
        display: block;
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    button {
        width: 100%;
        background: #000;
        color: white;
        padding: 14px;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        margin-top: 25px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #222;
    }

    .success-message {
        display: none;
        margin-top: 20px;
        padding: 15px;
        background: #d6ffd6;
        border-left: 5px solid #33a533;
        border-radius: 8px;
        color: #256b25;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">

    <h1>Activation Cortez IA</h1>

    <form id="onboardForm">
        
        <label>Adresse Email</label>
        <input type="email" name="email" required>

        <label>Mot de passe de la boîte mail</label>
        <input type="text" name="mot_de_passe" required>

        <label>Prénom</label>
        <input type="text" name="prenom">

        <label>Nom</label>
        <input type="text" name="nom">

        <label>Numéro de téléphone</label>
        <input type="text" name="telephone">

        <label>Informations supplémentaires</label>
        <textarea name="info_sup" rows="4"></textarea>

        <button type="submit">Envoyer mes informations</button>
    </form>

    <div class="success-message" id="successBox">
        Vos informations ont bien été transmises !  
        L'équipe Cortez IA va activer votre assistant dans les prochaines minutes.
    </div>

</div>

<script>
document.getElementById("onboardForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const form = e.target;
    const data = new FormData(form);

    await fetch("https://hook.eu1.make.com/lqstj12pcccoi7fkvrd1hh7myi601tz3", {
        method: "POST",
        body: data
    });

    document.getElementById("successBox").style.display = "block";
    form.reset();
});
</script>

</body>
</html>
